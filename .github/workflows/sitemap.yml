name: Rebuild sitemap

# 数据一变就重建 sitemap.xml / robots.txt（不再依赖本地手动跑）
on:
  push:
    branches: [main]
    paths:
      - 'data/resources.json'
      - 'data/site.json'
      - 'data/taxonomy.json'
      - 'scripts/build_sitemap.py'
      - 'scripts/gen_resource_pages.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate data
        run: python scripts/validate_data.py
      - name: Rebuild sitemap
        run: python scripts/build_sitemap.py
      - name: Generate static resource pages
        run: python scripts/gen_resource_pages.py
      - name: Head meta + asset stamp for generated pages
        run: |
          python scripts/inject_head_meta.py
          python scripts/stamp_assets.py
      - name: Validate sitemap XML
        run: python -c "import xml.dom.minidom as m; m.parse('sitemap.xml'); print('sitemap.xml OK')"
      # 分享链接体检：只报告、不阻断构建。
      # 2026-11-08 教训：10-20 那批 7 条用了短期分享（expired_type=2），
      # 静默过期后站内躺了 19 天没人发现 —— 所以每次数据变动都顺手体检一次。
      - name: Check share links (report only)
        continue-on-error: true
        run: python scripts/check_links.py --timeout 30
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt r '*.html'
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: auto rebuild sitemap + resource pages [skip ci]"
            git push
          fi
